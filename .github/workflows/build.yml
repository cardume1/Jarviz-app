name: Build Jarviz APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Verificar projeto
        run: |
          test -f gradle.properties
          grep -n "android.useAndroidX" gradle.properties

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: jarviz-apk
          path: app/build/outputs/apk/debug/*.apk
